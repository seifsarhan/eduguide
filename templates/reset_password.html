<!DOCTYPE html>
<html lang="{{ 'ar' if session.get('lang', 'en') == 'ar' else 'en' }}" dir="{{ 'rtl' if session.get('lang', 'en') == 'ar' else 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUGUIDE | Set New Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:'Plus Jakarta Sans', sans-serif; background:#f8fafc; color:#0f172a; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:22px; padding:34px; max-width:440px; width:100%; box-shadow:0 18px 45px rgba(15,23,42,0.06); }
    h1 { font-size:22px; font-weight:800; margin:0 0 10px; }
    label { display:block; font-size:12.5px; font-weight:700; color:#475569; margin-bottom:6px; }
    input { width:100%; box-sizing:border-box; padding:11px 14px; border-radius:10px; border:1px solid #cbd5e1; margin-bottom:14px; }
    button { width:100%; padding:13px; border-radius:11px; border:none; background:#10b981; color:#fff; font-weight:800; font-size:14px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    {% if valid %}
      <h1>Set New Password</h1>
      <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label>New Password (min 6 characters)</label>
        <input type="password" name="new_password" minlength="6" required>
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" minlength="6" required>
        <button type="submit">Reset Password</button>
      </form>
    {% else %}
      <h1>Link Expired or Invalid</h1>
      <p style="color:#64748b; font-size:14px;">This password reset token has expired or already been used.</p>
      <a href="{{ url_for('forgot_password') }}" style="color:#2563eb; font-weight:700;">Request a new reset link →</a>
    {% endif %}
  </div>
</body>
</html>
